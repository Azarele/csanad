<svg width="400" height="400" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background circle: fades #120016 ↔ #ffffff -->
  <circle cx="80" cy="80" r="78">
    <animate attributeName="fill"
      values="#120016;#ffffff;#120016"
      dur="4s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.5;1"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
  </circle>

  <!-- Subtle inner ring -->
  <circle cx="80" cy="80" r="72" fill="none" stroke="rgba(255,45,120,0.15)" stroke-width="1"/>

  <!-- Outer pink ring — stays constant -->
  <circle cx="80" cy="80" r="78" fill="none" stroke="#ff2d78" stroke-width="1.5"/>

  <!-- Divider line -->
  <line x1="80" y1="38" x2="80" y2="122" stroke="rgba(255,45,120,0.2)" stroke-width="1"/>

  <!-- C: fades #ffffff ↔ #120016 -->
  <text x="52" y="92" text-anchor="middle"
    font-family="'Space Mono', monospace"
    font-size="46" font-weight="700">
    <animate attributeName="fill"
      values="#ffffff;#120016;#ffffff"
      dur="4s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.5;1"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    C
  </text>

  <!-- K: stays pink always -->
  <text x="108" y="92" text-anchor="middle"
    font-family="'Space Mono', monospace"
    font-size="46" font-weight="700"
    fill="#ff2d78">K</text>
</svg>
