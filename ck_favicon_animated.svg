<svg width="32" height="32" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700');
      
      .bg {
        animation: bgFade 3s ease-in-out infinite alternate;
      }
      .ring {
        animation: ringFade 3s ease-in-out infinite alternate;
      }
      .letter-c {
        animation: cFade 3s ease-in-out infinite alternate;
      }
      .letter-k {
        animation: kFade 3s ease-in-out infinite alternate;
      }

      @keyframes bgFade {
        0%   { fill: #120016; }
        100% { fill: #faf7fb; }
      }
      @keyframes ringFade {
        0%   { stroke: #ff2d78; }
        100% { stroke: #d4005a; }
      }
      @keyframes cFade {
        0%   { fill: #ffffff; }
        100% { fill: #120016; }
      }
      @keyframes kFade {
        0%   { fill: #ff2d78; }
        100% { fill: #d4005a; }
      }
    </style>
  </defs>

  <circle class="bg" cx="80" cy="80" r="80"/>
  <circle class="ring" cx="80" cy="80" r="76" fill="none" stroke-width="3"/>
  <text class="letter-c" x="52" y="95" text-anchor="middle" font-family="'Space Mono', monospace" font-size="46" font-weight="700">C</text>
  <text class="letter-k" x="108" y="95" text-anchor="middle" font-family="'Space Mono', monospace" font-size="46" font-weight="700">K</text>
</svg>
